<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云端记事本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg: #f4f5fb;
    --card: #ffffff;
    --text: #1f2333;
    --text-sub: #7a7f95;
    --danger: #ef4444;
    --success: #10b981;
    --border: #e7e8f0;
    --shadow: 0 10px 30px rgba(31, 35, 51, 0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8f7ff 50%, #fdf2f8 100%);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ---------- 登录卡片 ---------- */
  .auth-wrap { display: flex; justify-content: center; padding-top: 8vh; }
  .auth-card {
    background: var(--card);
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 36px 32px 32px;
  }
  .logo {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 14px;
  }
  .auth-card h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
  .auth-card .sub { text-align: center; color: var(--text-sub); font-size: 13px; margin-bottom: 24px; }

  .tabs { display: flex; background: #f1f2f8; border-radius: 10px; padding: 4px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; border: none; background: transparent; padding: 9px 0;
    font-size: 14px; border-radius: 8px; cursor: pointer; color: var(--text-sub);
    transition: all .15s;
  }
  .tabs button.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.06); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px; outline: none; transition: border .15s;
    background: #fbfbfe;
  }
  .field input:focus { border-color: var(--primary); background: #fff; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .hint { margin-top: 14px; font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.6; }

  /* ---------- 主界面 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .userbox { display: flex; align-items: center; gap: 10px; }
  .nickname-chip {
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .nickname-chip:hover { border-color: var(--primary); color: var(--primary); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
  }

  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; outline: none; background: #fff;
  }
  .search:focus { border-color: var(--primary); }
  .btn-new { width: auto; padding: 11px 22px; }

  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .note-card {
    background: var(--card); border-radius: 14px; padding: 18px;
    box-shadow: 0 4px 14px rgba(31,35,51,.05);
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid transparent; transition: transform .12s, border .12s;
    cursor: pointer;
  }
  .note-card:hover { transform: translateY(-2px); border-color: #d9dbec; }
  .note-card h3 { font-size: 15px; line-height: 1.4; word-break: break-all; }
  .note-card p {
    font-size: 13px; color: var(--text-sub); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    white-space: pre-wrap; word-break: break-all; flex: 1;
  }
  .note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); }
  .note-del {
    border: none; background: none; color: var(--text-sub); cursor: pointer;
    font-size: 13px; padding: 2px 6px; border-radius: 6px;
  }
  .note-del:hover { color: var(--danger); background: #fef2f2; }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--text-sub);
    background: #fff; border-radius: 16px; grid-column: 1 / -1;
  }
  .empty .icon { font-size: 44px; margin-bottom: 12px; }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(31,35,51,.45);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; width: 100%; max-width: 520px;
    padding: 26px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .modal textarea {
    width: 100%; min-height: 180px; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; outline: none;
    line-height: 1.7; background: #fbfbfe;
  }
  .modal textarea:focus { border-color: var(--primary); background: #fff; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; }
  .btn-ghost { background: #f1f2f8; color: var(--text); }
  .btn-ghost:hover { background: #e6e7f0; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #dc2626; }

  /* ---------- 提示 ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px);
    background: #1f2333; color: #fff; padding: 11px 22px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: all .25s; z-index: 200; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.err { background: var(--danger); }

  .loading-mask {
    position: fixed; inset: 0; background: rgba(255,255,255,.75);
    display: none; align-items: center; justify-content: center; z-index: 300;
  }
  .loading-mask.show { display: flex; }
  .spinner {
    width: 38px; height: 38px; border: 4px solid #e0e1ee; border-top-color: var(--primary);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .container { padding: 20px 14px 40px; }
    .auth-card { padding: 28px 22px; }
    .topbar h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<!-- ========== 登录 / 注册 ========== -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="logo">📝</div>
    <h1>云端记事本</h1>
    <p class="sub">手机号 + 密码登录，笔记云端同步</p>

    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div class="field">
      <label>手机号</label>
      <input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="passwordInput" type="password" placeholder="请输入密码（至少 6 位）">
    </div>
    <div class="field" id="confirmField" style="display:none;">
      <label>确认密码</label>
      <input id="confirmInput" type="password" placeholder="请再次输入密码">
    </div>

    <button class="btn" id="authBtn" onclick="submitAuth()">登录</button>
    <p class="hint">密码经 Firebase 安全存储，仅用于登录验证<br>不同设备登录同一账号，笔记自动同步</p>
  </div>
</div>

<!-- ========== 主界面 ========== -->
<div class="container" id="appScreen" style="display:none;">
  <div class="topbar">
    <h1>📝 我的记事本</h1>
    <div class="userbox">
      <button class="nickname-chip" onclick="openNicknameModal()" title="点击修改昵称">
        <span id="nickDisplay">—</span> ✏️
      </button>
      <div class="avatar" id="avatarEl">?</div>
      <button class="nickname-chip" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="🔍 搜索标题或内容…" oninput="renderNotes()">
    <button class="btn btn-new" onclick="openNoteModal()">＋ 新建笔记</button>
  </div>

  <div class="notes-grid" id="notesGrid"></div>
</div>

<!-- ========== 笔记编辑弹窗 ========== -->
<div class="modal-mask" id="noteModal">
  <div class="modal">
    <h2 id="noteModalTitle">新建笔记</h2>
    <div class="field">
      <input id="noteTitleInput" placeholder="标题" maxlength="60">
    </div>
    <div class="field">
      <textarea id="noteContentInput" placeholder="写点什么…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeNoteModal()">取消</button>
      <button class="btn" id="noteSaveBtn" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<!-- ========== 昵称弹窗 ========== -->
<div class="modal-mask" id="nickModal">
  <div class="modal" style="max-width:380px;">
    <h2 id="nickModalTitle">设置你的昵称</h2>
    <div class="field">
      <input id="nickInput" placeholder="输入一个昵称吧" maxlength="20">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="nickCancelBtn" style="display:none;" onclick="closeNicknameModal()">取消</button>
      <button class="btn" onclick="saveNickname()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-mask" id="loadingMask"><div class="spinner"></div></div>

<!-- ================= Firebase 配置（部署前必改） ================= -->
<script type="module">
// ⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇⬇
//  第一步：打开 https://console.firebase.google.com
//  1. 添加项目（名字随便，如 notepad）
//  2. 「构建 → Firestore Database → 创建数据库」，位置选离你近的，模式选「测试模式」
//  3. 「项目设置 → 常规 → 你的应用」选 Web（</> 图标），注册应用后会得到下面这段配置
//  4. 把下方 firebaseConfig 的六个值替换成你自己的
//  5. 「认证 → 登录方式 → 启用「邮箱/密码」」
//  6. 部署到 GitHub Pages 后，回到控制台「Firestore → 规则」，把默认规则换成下面注释里的安全规则
// ⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆⬆
const firebaseConfig = {
  apiKey: "AIzaSyDtzmQhjYkjTk_xWkRvSLglg811VMO4Rss",
  authDomain: "memo-8f803.firebaseapp.com",
  projectId: "memo-8f803",
  storageBucket: "memo-8f803.firebasestorage.app",
  messagingSenderId: "177925733531",
  appId: "1:177925733531:web:6e1ca3ea301db40347da3e"
};

/* 部署稳定后，把 Firestore「规则」标签页内容换成：
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    match /notes/{noteId} {
      allow read: if request.auth != null && request.auth.uid == resource.data.ownerId;
      allow create: if request.auth != null && request.auth.uid == request.resource.data.ownerId;
      allow update, delete: if request.auth != null && request.auth.uid == resource.data.ownerId;
    }
  }
}
*/
// ================= 以下为应用逻辑，一般不需要改 =================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  query, where, orderBy, onSnapshot, serverTimestamp, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 状态
let currentUser = null;       // Firebase Auth 用户
let userData = null;          // users/{uid} 文档数据，含 nickname
let notes = [];               // 笔记列表
let editingNoteId = null;     // 正在编辑的笔记 id（null=新建）
let unsubNotes = null;
let authMode = 'login';

const $ = id => document.getElementById(id);

/* ---------- 工具 ---------- */
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function loading(on) { $('loadingMask').classList.toggle('show', on); }

// Firebase 错误码转中文
function errMsg(e) {
  const code = (e && e.code) || '';
  const map = {
    'auth/invalid-email': '手机号格式不正确',
    'auth/weak-password': '密码太简单，至少 6 位',
    'auth/email-already-in-use': '该手机号已注册，请直接登录',
    'auth/invalid-credential': '手机号或密码错误',
    'auth/user-not-found': '该手机号未注册',
    'auth/wrong-password': '密码错误',
    'auth/too-many-requests': '操作太频繁，请稍后再试',
    'auth/network-request-failed': '网络错误，请检查网络后重试',
  };
  return map[code] || (e && e.message) || '操作失败，请重试';
}

// 手机号 → Firebase Auth 用的伪装邮箱（Firebase 不支持纯手机号+密码登录）
const toEmail = phone => `${phone}@phone.login`;

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- 登录 / 注册 ---------- */
window.switchTab = mode => {
  authMode = mode;
  $('tabLogin').classList.toggle('active', mode === 'login');
  $('tabRegister').classList.toggle('active', mode === 'register');
  $('confirmField').style.display = mode === 'register' ? '' : 'none';
  $('authBtn').textContent = mode === 'login' ? '登录' : '注册并登录';
};

window.submitAuth = async () => {
  const phone = $('phoneInput').value.trim();
  const pwd = $('passwordInput').value;

  if (!/^1\d{10}$/.test(phone)) return toast('请输入正确的 11 位手机号', true);
  if (pwd.length < 6) return toast('密码至少 6 位', true);

  if (authMode === 'register') {
    if (pwd !== $('confirmInput').value) return toast('两次密码不一致', true);
    loading(true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, toEmail(phone), pwd);
      // 建用户资料文档
      await setDoc(doc(db, 'users', cred.user.uid), {
        phone,
        nickname: '',
        createdAt: serverTimestamp()
      });
      toast('注册成功！');
    } catch (e) {
      toast(errMsg(e), true);
    } finally { loading(false); }
  } else {
    loading(true);
    try {
      await signInWithEmailAndPassword(auth, toEmail(phone), pwd);
      toast('登录成功');
    } catch (e) {
      toast(errMsg(e), true);
    } finally { loading(false); }
  }
};

window.logout = async () => {
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  await signOut(auth);
  toast('已退出登录');
};

/* ---------- 认证状态监听 ---------- */
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    $('authScreen').style.display = 'none';
    $('appScreen').style.display = '';
    await loadUserProfile();
    subscribeNotes();
  } else {
    if (unsubNotes) { unsubNotes(); unsubNotes = null; }
    notes = []; userData = null;
    $('appScreen').style.display = 'none';
    $('authScreen').style.display = '';
  }
});

async function loadUserProfile() {
  loading(true);
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
      userData = snap.data();
    } else {
      // 兼容旧数据：没有文档就补一个
      userData = { phone: '', nickname: '' };
      await setDoc(doc(db, 'users', currentUser.uid), userData, { merge: true });
    }
    renderUser();
    // 没昵称 → 强制设置
    if (!userData.nickname) openNicknameModal(true);
  } catch (e) {
    toast('加载用户资料失败：' + errMsg(e), true);
  } finally { loading(false); }
}

function renderUser() {
  const nick = userData && userData.nickname ? userData.nickname : '未设置昵称';
  $('nickDisplay').textContent = nick;
  $('avatarEl').textContent = nick.slice(0, 1).toUpperCase();
}

/* ---------- 昵称 ---------- */
window.openNicknameModal = (isFirst = false) => {
  $('nickModalTitle').textContent = isFirst ? '先给自己起个昵称吧' : '修改昵称';
  $('nickCancelBtn').style.display = isFirst ? 'none' : '';
  $('nickInput').value = (userData && userData.nickname) || '';
  $('nickModal').classList.add('show');
  $('nickInput').focus();
};
window.closeNicknameModal = () => {
  if (!userData || !userData.nickname) return; // 首次必须设置，不允许关
  $('nickModal').classList.remove('show');
};

window.saveNickname = async () => {
  const nick = $('nickInput').value.trim();
  if (!nick) return toast('昵称不能为空', true);
  loading(true);
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { nickname: nick });
    userData.nickname = nick;
    renderUser();
    $('nickModal').classList.remove('show');
    toast('昵称已保存');
  } catch (e) {
    toast('保存失败：' + errMsg(e), true);
  } finally { loading(false); }
};

/* ---------- 笔记：实时订阅 ---------- */
function subscribeNotes() {
  if (unsubNotes) unsubNotes();
  const q = query(
    collection(db, 'notes'),
    where('ownerId', '==', currentUser.uid),
    orderBy('updatedAt', 'desc')
  );
  unsubNotes = onSnapshot(q, snap => {
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNotes();
  }, e => {
    toast('加载笔记失败：' + errMsg(e), true);
  });
}

window.renderNotes = () => {
  const kw = $('searchInput').value.trim().toLowerCase();
  const list = kw
    ? notes.filter(n =>
        (n.title || '').toLowerCase().includes(kw) ||
        (n.content || '').toLowerCase().includes(kw))
    : notes;

  const grid = $('notesGrid');
  if (!list.length) {
    grid.innerHTML = `
      <div class="empty">
        <div class="icon">${kw ? '🔍' : '🗒️'}</div>
        <div>${kw ? '没有找到匹配的笔记' : '还没有笔记，点右上角「新建笔记」开始记录吧'}</div>
      </div>`;
    return;
  }
  grid.innerHTML = list.map(n => `
    <div class="note-card" onclick="openNoteModal('${n.id}')">
      <h3>${escapeHtml(n.title || '无标题')}</h3>
      <p>${escapeHtml(n.content || '')}</p>
      <div class="note-meta">
        <span>${fmtTime(n.updatedAt)}</span>
        <button class="note-del" onclick="event.stopPropagation(); deleteNote('${n.id}')">删除</button>
      </div>
    </div>`).join('');
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ---------- 笔记：增删改 ---------- */
window.openNoteModal = (id = null) => {
  editingNoteId = id;
  const n = id ? notes.find(x => x.id === id) : null;
  $('noteModalTitle').textContent = n ? '编辑笔记' : '新建笔记';
  $('noteTitleInput').value = n ? (n.title || '') : '';
  $('noteContentInput').value = n ? (n.content || '') : '';
  $('noteModal').classList.add('show');
  $('noteTitleInput').focus();
};
window.closeNoteModal = () => {
  editingNoteId = null;
  $('noteModal').classList.remove('show');
};

window.saveNote = async () => {
  const title = $('noteTitleInput').value.trim();
  const content = $('noteContentInput').value.trim();
  if (!title && !content) return toast('标题和内容至少填一个', true);

  const btn = $('noteSaveBtn');
  btn.disabled = true;
  try {
    if (editingNoteId) {
      await updateDoc(doc(db, 'notes', editingNoteId), {
        title, content, updatedAt: serverTimestamp()
      });
      toast('已保存');
    } else {
      await addDoc(collection(db, 'notes'), {
        ownerId: currentUser.uid,
        title, content,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      toast('已创建');
    }
    closeNoteModal();
  } catch (e) {
    toast('保存失败：' + errMsg(e), true);
  } finally { btn.disabled = false; }
};

window.deleteNote = async id => {
  if (!confirm('确定删除这条笔记吗？删除后无法恢复。')) return;
  loading(true);
  try {
    await deleteDoc(doc(db, 'notes', id));
    toast('已删除');
  } catch (e) {
    toast('删除失败：' + errMsg(e), true);
  } finally { loading(false); }
};

/* ---------- 弹窗快捷键 ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('noteModal').classList.contains('show')) closeNoteModal();
    else if ($('nickModal').classList.contains('show')) closeNicknameModal();
  }
  if (e.key === 'Enter' && $('noteModal').classList.contains('show') &&
      document.activeElement.tagName !== 'TEXTAREA') {
    saveNote();
  }
  if (e.key === 'Enter' && $('nickModal').classList.contains('show')) {
    saveNickname();
  }
  if (e.key === 'Enter' && $('authScreen').style.display !== 'none') {
    submitAuth();
  }
});
</script>
