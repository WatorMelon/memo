<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云记事本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
  }
  .page { display: none; min-height: 100vh; animation: fadeIn .25s ease-out; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .list-wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap:wrap; gap:10px; }
  .list-header h1 { font-size: 22px; color: #2d3436; }
  .new-btn {
    padding: 9px 18px; background: #2d3436; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .new-btn:hover { background: #000; }
  .search {
    width: 100%; padding: 10px 14px; margin-bottom: 16px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    background: #fff;
  }
  .search:focus { border-color: #2d3436; }
  .note-card {
    background: #fff; border: 1px solid #e5e5dd; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    transition: box-shadow .15s;
  }
  .note-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .note-card .info { min-width: 0; }
  .note-card .title {
    font-size: 15px; font-weight: bold; color: #2d3436;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-card .date { font-size: 12px; color: #999; margin-top: 4px; }
  .note-card .del {
    flex: none; padding: 5px 12px; background: #e74c3c; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .empty { text-align: center; color: #aaa; padding: 60px 0; }

  .edit-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd;
    position: sticky; top: 0;
  }
  .back-btn {
    padding: 7px 16px; background: #f0f0ea; color: #2d3436;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .back-btn:hover { background: #e2e2da; }
  .save-status { flex: 1; font-size: 12px; color: #999; }
  .char-count { font-size: 12px; color: #bbb; }
  .del-btn {
    padding: 7px 14px; background: #e74c3c; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .del-btn:hover { background: #c0392b; }
  .edit-body { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }
  .title-input {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 26px; font-weight: bold; color: #2d3436;
    padding: 8px 0 12px; font-family: inherit;
    border-bottom: 1px solid #e5e5dd;
  }
  .content-input {
    width: 100%; border: none; outline: none; background: transparent;
    resize: vertical; min-height: 55vh; padding: 16px 0;
    font-size: 16px; line-height: 1.9; color: #333; font-family: inherit;
  }

  .modal-wrap {
    position: fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
    z-index:999;
  }
  .modal-box {
    background:#fff; border-radius:12px; width:90%; max-width:420px; padding:24px;
  }
  .modal-box h2 { margin-bottom:16px; font-size:20px; color:#2d3436; }
  .tab-bar { display:flex; gap:4px; margin-bottom:12px; }
  .tab-btn { flex:1; padding:8px; border:1px solid #ddd; background:#f8f8f8; border-radius:6px; cursor:pointer; }
  .tab-btn.active { background:#2d3436; color:#fff; border-color:#2d3436; }
  .modal-box input {
    width:100%; padding:10px 12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; outline:none;
  }
  .modal-box button {
    width:100%; padding:10px; margin-top:8px; border:none; border-radius:8px; cursor:pointer; font-size:14px;
  }
  .btn-primary { background:#2d3436; color:#fff; }
  .btn-secondary { background:#eee; color:#222; }
  .tip { font-size:12px; color:#777; margin-top:8px; line-height:1.5; }
  .user-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .logout-btn { padding:7px 12px; background:#eee; border:none; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div id="loginModal" class="modal-wrap">
  <div class="modal-box">
    <h2>云记事本</h2>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('email')">邮箱账号</button>
      <button class="tab-btn" onclick="switchTab('phone')">手机号账号</button>
    </div>
    <div id="panelEmail">
      <input id="emailInput" placeholder="邮箱地址" type="email">
      <input id="pwdInput" placeholder="密码（至少6位）" type="password">
      <button class="btn-primary" onclick="loadSupabaseAndSignUpEmail()">注册账号</button>
      <button class="btn-primary" onclick="loadSupabaseAndSignInEmail()">邮箱登录</button>
    </div>
    <div id="panelPhone" style="display:none;">
      <input id="phoneInput" placeholder="手机号（11位国内号码）" type="tel">
      <input id="phonePwdInput" placeholder="密码（至少6位）" type="password">
      <button class="btn-primary" onclick="loadSupabaseAndSignUpPhone()">手机号注册（无需验证码）</button>
      <button class="btn-primary" onclick="loadSupabaseAndSignInPhone()">手机号登录</button>
    </div>
    <button class="btn-secondary" onclick="localMode()">本地离线模式（仅保存在浏览器，无需网络）</button>
    <div class="tip">本地模式不需要联网，笔记保存在当前浏览器。<br>手机号注册无需短信验证码，手机号保存在用户资料中。</div>
  </div>
</div>

<div class="page active" id="pageList">
  <div class="list-wrap">
    <div class="list-header">
      <h1>我的笔记</h1>
      <div class="user-bar">
        <span id="userInfo"></span>
        <button class="logout-btn" id="logoutBtn" onclick="signOut()" hidden>退出登录</button>
        <button class="new-btn" onclick="newNote()">＋ 新建笔记</button>
      </div>
    </div>
    <input class="search" id="searchInput" placeholder="搜索笔记..." oninput="renderList()">
    <div id="noteList"></div>
    <div class="empty" id="emptyTip" hidden>暂无笔记，点「新建笔记」开始 ✍️</div>
  </div>
</div>

<div class="page" id="pageEdit">
  <div class="edit-toolbar">
    <button class="back-btn" onclick="backToList()">← 返回</button>
    <span class="save-status" id="saveStatus"></span>
    <span class="char-count" id="charCount"></span>
    <button class="del-btn" onclick="deleteCurrentNote()">删除</button>
  </div>
  <div class="edit-body">
    <input class="title-input" id="titleInput" placeholder="标题" maxlength="60">
    <textarea class="content-input" id="contentInput" placeholder="开始记录..."></textarea>
  </div>
</div>

<script>
let notes = [];
let currentId = null;
let saveTimer = null;
let user = null;
let isLocalMode = false;
let supabase = null;
const LOCAL_KEY = 'notepad_local';
const SUPABASE_URL = "https://ywzyufuhiqolshvarjkm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3enl1ZnVoaXFvbHN2YXJqa20iLCJpYXQiOjE3OTA3NzU0OTAsImV4cCI6MjEwNjMxMTQ5MH0.akN_AyhpBLIGOCjt7yf0FWSBWl_VwsuLxNfkZIIpidQ";

// 切换登录Tab
function switchTab(type){
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(type === 'email'){
    document.getElementById('panelEmail').style.display='block';
    document.getElementById('panelPhone').style.display='none';
  }else{
    document.getElementById('panelEmail').style.display='none';
    document.getElementById('panelPhone').style.display='block';
  }
}

// ========== 本地模式（完全独立，不加载supabase） ==========
function localMode() {
  isLocalMode = true;
  document.getElementById('loginModal').style.display = 'none';
  const raw = localStorage.getItem(LOCAL_KEY);
  if(raw) {
    notes = JSON.parse(raw);
  } else {
    notes = [{
      id: Date.now(),
      title: '欢迎使用记事本',
      content: '✅ 本地模式：笔记保存在浏览器本地\n✅ 清除浏览器缓存会丢失笔记\n✅ 切换云端登录开启在线同步',
      updated_at: new Date().toISOString()
    }];
    saveLocal();
  }
  renderList();
}

function saveLocal() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(notes));
}

function getCurrentNote() {
  return notes.find(n => n.id === currentId);
}

function fmtTime(timeStr) {
  const d = new Date(timeStr);
  return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// 渲染笔记列表
function renderList() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = notes.filter(n => {
    const text = (n.title + n.content).toLowerCase();
    return text.includes(kw);
  });
  document.getElementById('emptyTip').hidden = filtered.length > 0;
  const container = document.getElementById('noteList');
  container.innerHTML = '';
  filtered.forEach(note => {
    const div = document.createElement('div');
    div.className = 'note-card';
    div.onclick = () => openNote(note.id);
    div.innerHTML = `
      <div class="info">
        <div class="title">${note.title || '无标题'}</div>
        <div class="date">${fmtTime(note.updated_at)}</div>
      </div>
      <button class="del" onclick="event.stopPropagation(); deleteNoteById(${note.id})">删除</button>
    `;
    container.appendChild(div);
  })
}

// 打开笔记
async function openNote(id) {
  currentId = id;
  const n = getCurrentNote();
  document.getElementById('titleInput').value = n.title;
  document.getElementById('contentInput').value = n.content;
  document.getElementById('saveStatus').textContent = '已保存 ' + fmtTime(n.updated_at);
  updateCharCount();
  showPage('pageEdit');
}

// 新建笔记
async function newNote() {
  if(isLocalMode){
    const newNoteObj = {
      id: Date.now(),
      title: '',
      content: '',
      updated_at: new Date().toISOString()
    };
    notes.unshift(newNoteObj);
    saveLocal();
    renderList();
    openNote(newNoteObj.id);
    return;
  }
  //云端新建
  const {data,error} = await supabase.from('notes').insert({
    title:'',
    content:'',
    user_id: user.id
  }).select().single();
  if(error){
    alert('新建笔记失败：'+error.message);
    return;
  }
  notes.unshift(data);
  renderList();
  openNote(data.id);
}

async function backToList() {
  clearTimeout(saveTimer);
  await saveNoteNow();
  currentId = null;
  renderList();
  showPage('pageList');
}

async function deleteNoteById(id) {
  if(!confirm('确定删除这条笔记？')) return;
  notes = notes.filter(n=>n.id !== id);
  if(isLocalMode) {
    saveLocal();
  } else {
    const {error} = await supabase.from('notes').delete().eq('id',id);
    if(error) alert('删除失败：'+error.message);
  }
  renderList();
}

async function deleteCurrentNote() {
  if(!currentId) return;
  if(!confirm('确定删除当前笔记？')) return;
  await deleteNoteById(currentId);
  backToList();
}

function updateCharCount() {
  const len = document.getElementById('contentInput').value.length;
  document.getElementById('charCount').textContent = len + ' 字';
}

async function saveNoteNow() {
  const n = getCurrentNote();
  if(!n) return;
  const title = document.getElementById('titleInput').value.trim();
  const content = document.getElementById('contentInput').value;
  if(isLocalMode) {
    n.title = title;
    n.content = content;
    n.updated_at = new Date().toISOString();
    saveLocal();
    document.getElementById('saveStatus').textContent = '已保存 ' + fmtTime(n.updated_at);
    updateCharCount();
    return;
  }
  //云端更新
  const {data,error} = await supabase.from('notes')
    .update({title, content})
    .eq('id',n.id)
    .select().single();
  if(error) {
    alert('云端保存失败：' + error.message);
    return;
  }
  Object.assign(n, data);
  document.getElementById('saveStatus').textContent = '已保存 ' + fmtTime(n.updated_at);
  updateCharCount();
}

function scheduleAutoSave() {
  document.getElementById('saveStatus').textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNoteNow, 500);
}

// ========== 云端SDK加载 ==========
async function loadSupabaseSDK(){
  if(supabase) return;
  await new Promise((resolve,reject)=>{
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  })
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

// ========== 邮箱注册登录 ==========
async function loadSupabaseAndSignUpEmail() {
  await loadSupabaseSDK();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('pwdInput').value;
  if(!email || password.length <6){
    alert('邮箱不能为空，密码至少6位');
    return;
  }
  const { error } = await supabase.auth.signUp({email, password});
  if(error){
    alert('注册失败：' + error.message);
    return;
  }
  alert('邮箱注册成功！如开启邮箱验证，请打开邮箱激活账号。');
}
async function loadSupabaseAndSignInEmail() {
  await loadSupabaseSDK();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('pwdInput').value;
  const { data, error } = await supabase.auth.signInWithPassword({email, password});
  if(error){
    alert('登录失败：' + error.message);
    return;
  }
  user = data.session.user;
  await loginSuccess();
}

// ========== 手机号注册登录（无需短信验证码） ==========
async function loadSupabaseAndSignUpPhone() {
  await loadSupabaseSDK();
  const phone = document.getElementById('phoneInput').value.trim();
  const password = document.getElementById('phonePwdInput').value;
  const reg = /^1[3-9]\d{9}$/;
  if(!reg.test(phone)){
    alert('请输入合法11位手机号');
    return;
  }
  if(password.length <6){
    alert('密码至少6位');
    return;
  }
  // 虚拟邮箱：手机号@fake.local
  const fakeEmail = `${phone}@fake.local`;
  const { error } = await supabase.auth.signUp({
    email: fakeEmail,
    password,
    options:{
      data:{
        phone: phone
      }
    }
  });
  if(error){
    alert('手机号注册失败：' + error.message);
    return;
  }
  alert('手机号注册成功！无需短信验证码。\n登录直接填入手机号+密码即可。');
}

async function loadSupabaseAndSignInPhone() {
  await loadSupabaseSDK();
  const phone = document.getElementById('phoneInput').value.trim();
  const password = document.getElementById('phonePwdInput').value;
  const reg = /^1[3-9]\d{9}$/;
  if(!reg.test(phone)){
    alert('请输入合法11位手机号');
    return;
  }
  if(password.length <6){
    alert('密码至少6位');
    return;
  }
  const fakeEmail = `${phone}@fake.local`;
  const { data, error } = await supabase.auth.signInWithPassword({
    email: fakeEmail,
    password
  });
  if(error){
    alert('手机号登录失败：' + error.message);
    return;
  }
  user = data.session.user;
  await loginSuccess();
}

async function loginSuccess() {
  document.getElementById('loginModal').style.display = 'none';
  // 优先展示手机号，没有则展示邮箱
  const phoneMeta = user.user_metadata?.phone;
  if(phoneMeta){
    document.getElementById('userInfo').textContent = `手机号：${phoneMeta}`;
  }else{
    document.getElementById('userInfo').textContent = user.email;
  }
  document.getElementById('logoutBtn').hidden = false;
  await fetchCloudNotes();
  renderList();
}

async function fetchCloudNotes() {
  const {data, error} = await supabase
    .from('notes')
    .select('*')
    .order('updated_at', {ascending: false});
  if(error) {
    console.error('拉取笔记失败', error);
    alert('云端读取失败：' + error.message);
    return;
  }
  notes = data;
}

async function signOut() {
  await supabase.auth.signOut();
  user = null;
  notes = [];
  isLocalMode = false;
  document.getElementById('logoutBtn').hidden = true;
  document.getElementById('userInfo').textContent = '';
  document.getElementById('loginModal').style.display = 'flex';
}

document.getElementById('titleInput').addEventListener('input', scheduleAutoSave);
document.getElementById('contentInput').addEventListener('input', scheduleAutoSave);
</script>
</body>
</html>
