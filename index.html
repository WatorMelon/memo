<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记事本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
  }

  /* ===== 页面切换动画 ===== */
  .page { display: none; min-height: 100vh; animation: fadeIn .25s ease-out; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===== 列表页 ===== */
  .list-wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .list-header h1 { font-size: 22px; color: #2d3436; }
  .new-btn {
    padding: 9px 18px; background: #2d3436; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .new-btn:hover { background: #000; }
  .search {
    width: 100%; padding: 10px 14px; margin-bottom: 16px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    background: #fff;
  }
  .search:focus { border-color: #2d3436; }
  .note-card {
    background: #fff; border: 1px solid #e5e5dd; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    transition: box-shadow .15s;
  }
  .note-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .note-card .info { min-width: 0; }
  .note-card .title {
    font-size: 15px; font-weight: bold; color: #2d3436;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-card .date { font-size: 12px; color: #999; margin-top: 4px; }
  .note-card .del {
    flex: none; padding: 5px 12px; background: #e74c3c; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
    opacity: 0; transition: opacity .15s;
  }
  .note-card:hover .del { opacity: 1; }
  .empty { text-align: center; color: #aaa; padding: 60px 0; }

  /* ===== 编辑页（全屏） ===== */
  .edit-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd;
    position: sticky; top: 0;
  }
  .back-btn {
    padding: 7px 16px; background: #f0f0ea; color: #2d3436;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .back-btn:hover { background: #e2e2da; }
  .save-status { flex: 1; font-size: 12px; color: #999; }
  .char-count { font-size: 12px; color: #bbb; }
  .del-btn {
    padding: 7px 14px; background: #e74c3c; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .del-btn:hover { background: #c0392b; }
  .edit-body { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }
  .title-input {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 26px; font-weight: bold; color: #2d3436;
    padding: 8px 0 12px; font-family: inherit;
    border-bottom: 1px solid #e5e5dd;
  }
  .content-input {
    width: 100%; border: none; outline: none; background: transparent;
    resize: vertical; min-height: 55vh; padding: 16px 0;
    font-size: 16px; line-height: 1.9; color: #333; font-family: inherit;
  }
</style>
</head>
<body>

<!-- ========== 页面一：列表页 ========== -->
<div class="page active" id="pageList">
  <div class="list-wrap">
    <div class="list-header">
      <h1>我的笔记</h1>
      <button class="new-btn" onclick="newNote()">＋ 新建笔记</button>
    </div>
    <input class="search" id="searchInput" placeholder="搜索笔记..." oninput="renderList()">
    <div id="noteList"></div>
    <div class="empty" id="emptyTip" hidden>暂无笔记，点「新建笔记」开始 ✍️</div>
  </div>
</div>

<!-- ========== 页面二：编辑页（全屏） ========== -->
<div class="page" id="pageEdit">
  <div class="edit-toolbar">
    <button class="back-btn" onclick="backToList()">← 返回</button>
    <span class="save-status" id="saveStatus"></span>
    <span class="char-count" id="charCount"></span>
    <button class="del-btn" onclick="delNote()">删除</button>
  </div>
  <div class="edit-body">
    <input class="title-input" id="titleInput" placeholder="标题" maxlength="60">
    <textarea class="content-input" id="contentInput" placeholder="开始记录..."></textarea>
  </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('notepad2') || 'null');
let currentId = null;
let saveTimer = null;

// 第一次打开：自动建一篇欢迎笔记
if (!notes) {
  notes = [{
    id: Date.now(),
    title: '欢迎使用记事本',
    content: '· 这里只显示标题，点卡片进入全屏编辑\n· 打字自动保存\n· 数据只存在这台电脑的浏览器里',
    updated: Date.now()
  }];
  save();
}

function save() {
  localStorage.setItem('notepad2', JSON.stringify(notes));
}

function current() {
  return notes.find(n => n.id === currentId);
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ===== 列表页 ===== */
function renderList() {
  const keyword = document.getElementById('searchInput').value.trim();
  const list = notes.filter(n => (n.title + '\n' + n.content).includes(keyword));
  document.getElementById('emptyTip').hidden = list.length > 0;

  document.getElementById('noteList').innerHTML = list.map(n => `
    <div class="note-card" onclick="openNote(${n.id})">
      <div class="info">
        <div class="title"></div>
        <div class="date">${fmtTime(n.updated)}</div>
      </div>
      <button class="del" onclick="event.stopPropagation(); deleteNote(${n.id})">删除</button>
    </div>
  `).join('');
  // 用 textContent 填标题，防止 HTML 注入
  document.querySelectorAll('#noteList .title').forEach((el, i) => {
    el.textContent = list[i].title || '（无标题）';
  });
}

/* ===== 编辑页 ===== */
function openNote(id) {
  currentId = id;
  const n = current();
  document.getElementById('titleInput').value = n.title;
  document.getElementById('contentInput').value = n.content;
  document.getElementById('saveStatus').textContent = '已保存 ' + fmtTime(n.updated);
  updateCount();
  showPage('pageEdit');
  setTimeout(() => document.getElementById('contentInput').focus(), 100);
}

function newNote() {
  const n = { id: Date.now(), title: '', content: '', updated: Date.now() };
  notes.unshift(n);
  save();
  renderList();
  openNote(n.id);
}

function backToList() {
  clearTimeout(saveTimer);
  doSave();           // 返回前立即保存一次
  currentId = null;
  renderList();
  showPage('pageList');
}

function deleteNote(id) {
  if (!confirm('确定删除这篇笔记吗？')) return;
  notes = notes.filter(n => n.id !== id);
  save();
  renderList();
}

function delNote() {
  if (notes.length <= 1) return alert('至少保留一篇笔记！');
  if (!confirm('确定删除这篇笔记吗？')) return;
  deleteNote(currentId);
  backToList();
}

function updateCount() {
  document.getElementById('charCount').textContent =
    document.getElementById('contentInput').value.length + ' 字';
}

function doSave() {
  const n = current();
  if (!n) return;
  n.title = document.getElementById('titleInput').value.trim();
  n.content = document.getElementById('contentInput').value;
  n.updated = Date.now();
  save();
  document.getElementById('saveStatus').textContent = '已保存 ' + fmtTime(n.updated);
  updateCount();
}

// 输入时防抖自动保存（500ms）
function scheduleSave() {
  document.getElementById('saveStatus').textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
document.getElementById('titleInput').addEventListener('input', scheduleSave);
document.getElementById('contentInput').addEventListener('input', scheduleSave);

// 标题按回车直接进入正文
document.getElementById('titleInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('contentInput').focus(); }
});

renderList();
</script>
</body>
</html>
